<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }} | SecureHome</title><link rel="stylesheet" href="/style.css"></head>
<body class="admin-body">
<aside class="sidebar"><a class="brand" href="/dashboard"><span class="brand-icon">⌂</span> Secure<span>Home</span></a><p class="side-label">ADMIN WORKSPACE</p><nav class="side-nav"><a class="{% if request.endpoint == 'dashboard' %}selected{% endif %}" href="/dashboard"><span>▦</span> Dashboard</a><a class="{% if request.endpoint == 'camera' %}selected{% endif %}" href="/camera"><span>◉</span> Live Camera <i class="nav-live"></i></a><a class="{% if request.endpoint == 'users' %}selected{% endif %}" href="/users"><span>♙</span> Authorized Users</a><a class="{% if request.endpoint == 'alerts' %}selected{% endif %}" href="/alerts"><span>⚠</span> Unknown Visitors</a><a class="{% if request.endpoint == 'logs' %}selected{% endif %}" href="/logs"><span>◷</span> Security Logs</a></nav><div class="side-bottom"><span class="live-dot"></span> Admin session active<a href="/logout" class="logout-btn" style="text-decoration:none;">↪ Log out</a></div></aside>
<main class="admin-main">
  <header class="admin-top">
    <div><p class="crumb">Workspace / {{ title }}</p><h1>{{ header_title }}</h1></div>
    <div class="admin-profile"><span class="online-label"><i></i> System online</span><div class="avatar">AD</div><span>Administrator</span></div>
  </header>
  <section class="admin-content">
    {% block content %}{% endblock %}
  </section>
</main>
</body></html>
